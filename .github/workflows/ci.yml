name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real database, not a mock, because that is what the analytics tests are
    # for: the closed allow-list, the daily-rotating identifier and the
    # retention delete are all claims about what reaches a table.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: finnlakin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/finnlakin_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and house style
        run: npm run lint

      # Build first: Next generates the typed-route definitions that
      # PageProps<"/writing/[slug]"> resolves against, so a standalone tsc on a
      # clean checkout fails on routes that are perfectly valid.
      #
      # A malformed rule is dropped by the CSS optimiser with a warning and the
      # build still succeeds, so the rule silently does nothing: that is how the
      # text link lost its hover underline for a dozen commits. A warning from
      # the optimiser fails the build here instead. bash is named so pipefail is
      # on, and a failed build still fails through the tee.
      - name: Build
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "while optimizing generated CSS" build.log; then
            echo "::error::the CSS optimiser dropped a rule; see its warning above"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      # Only Chromium. The suite runs one engine on two viewports, so the other
      # browsers would be several minutes of download for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
